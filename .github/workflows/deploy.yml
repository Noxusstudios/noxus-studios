name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Content-hash cache-busting: stamp ?v=<hash> on every CSS/JS ref so
      # returning devices never get stuck on a stale immutable-cached asset.
      - run: node stamp-assets.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 133fd89a169b7950fbcf7c249d0ed68b
          command: pages deploy . --project-name noxus-studios --branch main --commit-dirty=true
